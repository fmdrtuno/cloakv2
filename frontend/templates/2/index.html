<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!--PAGE_TITLE_PLACEHOLDER--></title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!--GOOGLE_GTAG_PLACEHOLDER-->
    <!--TIKTOK_PIXEL_PLACEHOLDER-->
    <!--META_PIXEL_PLACEHOLDER-->
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="images/logo.png" alt="Logo">
            </div>
            <a href="<!--SUPPORT_HREF_PLACEHOLDER-->" class="support-button">Hỗ Trợ</a>
        </header>

        <main>
            <section class="banner">
                <a href="<!--BANNER_HREF_PLACEHOLDER-->">
                    <img src="images/main-banner.png" alt="Main Banner">
                </a>
            </section>

            <section class="promo-grid">
                <!--PROMO_ITEMS_PLACEHOLDER-->
                <!-- Example of a single promo item -->
                <div class="promo-item">
                    <span class="promo-title">ĐĂNG KÝ</span>
                    <span class="promo-value">66K</span>
                    <span class="promo-description">Nhận ngay</span>
                </div>
                <div class="promo-item">
                    <span class="promo-title">NẠP ĐẦU</span>
                    <span class="promo-value">100%</span>
                    <span class="promo-description">Thưởng</span>
                </div>
                <div class="promo-item">
                    <span class="promo-title">NHIỆM VỤ</span>
                    <span class="promo-value">188K</span>
                    <span class="promo-description">Thưởng</span>
                </div>
                <div class="promo-item">
                    <span class="promo-title">HOÀN TRẢ</span>
                    <span class="promo-value">1.2%</span>
                    <span class="promo-description">Mỗi ngày</span>
                </div>
                <!-- End of example -->
            </section>

            <section class="cta-section">
                <div class="cta-content">
                    <h3>NHIỆM VỤ MỖI NGÀY</h3>
                    <p>Hoàn thành để nhận thưởng lớn!</p>
                </div>
                <a href="<!--DAILY_MISSION_HREF_PLACEHOLDER-->" class="cta-button">NHẬN</a>
            </section>

            <section class="cta-section">
                <div class="cta-content">
                    <h3>GIFTCODE MỖI NGÀY</h3>
                </div>
                <a href="<!--GIFTCODE_HREF_PLACEHOLDER-->" class="cta-button">NHẬN MÃ</a>
            </section>
        </main>

        <footer class="footer">
            <div class="company-info">
                <!--COMPANY_INFO_PLACEHOLDER-->
                <p>Công ty truyền thông giải trí M.B66</p>
                <p>Địa chỉ: 20 Ung Văn Khiêm, Bình Thạnh, TPHCM</p>
            </div>
            <div class="footer-buttons">
                <a href="<!--LOGIN_HREF_PLACEHOLDER-->" class="footer-button-secondary">ĐĂNG NHẬP</a>
                <a href="<!--REGISTER_HREF_PLACEHOLDER-->" class="footer-button-primary">ĐĂNG KÝ</a>
            </div>
        </footer>
    </div>
</body>
</html>
